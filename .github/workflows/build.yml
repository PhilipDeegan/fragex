name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -qyy libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev \
          xvfb libgl1-mesa-dri

    - name: Build/Test
      run: |
        curl -fL --retry 3 -o mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        export PATH="$PWD:$PATH"  # mkn.gl's mkn.sh runs mkn
        KLOG=3 ./mkn clean build run -dtOp test -x res/mkn/ubuntu
        KLOG=3 ./mkn clean build -dtOp bin -x res/mkn/ubuntu -l -pthread
        # renders offscreen through OpenGL (mesa llvmpipe) and checks it against the CPU image
        xvfb-run -a ./bin/bin/fragex ".*1.*" --save sierpinski.png
        cmp sierpinski.png res/sierpinski.png
